name: Generate snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      - name: Publish snake files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output:refs/remotes/origin/output
            git switch -C output origin/output
          else
            git switch --orphan output
            git rm -r --cached . >/dev/null 2>&1 || true
          fi

          test -d dist
          find . -mindepth 1 -maxdepth 1 ! -name dist ! -name .git -exec rm -rf {} +
          mv dist/* .
          rm -rf dist

          git add -A .

          if git diff --cached --quiet; then
            echo "No snake changes to publish."
          else
            git commit -m "Update generated snake assets"
            git push origin output
          fi
